name: CareerClaw Autonomous Career Agent CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install System Dependencies (Typst & Fonts)
      run: |
        sudo apt-get update
        sudo apt-get install -y typst fonts-liberation

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pydantic pydantic-settings python-multipart
        pip install "rendercv[full]" pypdf python-jobspy tavily-python APScheduler
        pip install pyjwt playwright pytest httpx
        playwright install chromium

    - name: Run Pytest Verification Suite across Phases 1-7
      env:
        NEBIUS_API_KEY: "ci_test_token"
        TAVILY_API_KEY: "tvly-citesttoken123"
        HITL_JWT_SECRET: "ci-secret-jwt-key"
      run: |
        pytest tests/test_phase1_foundation.py -v
        pytest tests/test_phase2_memory.py -v
        pytest tests/test_phase3_discovery.py -v
        pytest tests/test_phase4_rendercv.py -v
        pytest tests/test_phase5_browser_hitl.py -v
        pytest tests/test_phase6_gmail_gcal.py -v
        pytest tests/test_phase7_e2e_judge_sandbox.py -v

  test-frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install Frontend Dependencies
      working-directory: frontend
      run: npm install

    - name: Run Next.js Production Build
      working-directory: frontend
      run: npm run build

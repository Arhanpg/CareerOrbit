# Render Blueprint Specification for CareerOrbit Backend
# 100% Free Tier Web Service Deployment on render.com
services:
  - type: web
    name: careerorbit-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: HEADLESS
        value: "true"
      - key: NEBIUS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: HITL_JWT_SECRET
        generateValue: true
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: FRONTEND_PUBLIC_URL
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: CANDIDATE_EMAIL
        sync: false
